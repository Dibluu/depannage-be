name: IndexNow

# After each successful Vercel production deploy, tell Bing & co. which pages are new or changed.
on:
  deployment_status:
  workflow_dispatch:
    inputs:
      all:
        description: Submit every sitemap page, not only changed ones
        type: boolean
        default: false

jobs:
  submit:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Fingerprints from the previous run, to submit only what changed.
      - uses: actions/cache/restore@v4
        with:
          path: .indexnow-state.json
          key: indexnow-${{ github.run_id }}
          restore-keys: indexnow-
      - run: node scripts/indexnow.mjs ${{ inputs.all && '--all' || '' }}
      - uses: actions/cache/save@v4
        with:
          path: .indexnow-state.json
          key: indexnow-${{ github.run_id }}
